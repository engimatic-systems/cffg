[project]
name = "cffg"
version = "0.1.0"
description = "Constrained Forney-style Factor Graphs and Lagrangian Active Inference in JAX"
readme = "README.md"
authors = [
    { name = "coopwilliams", email = "ken.c.williams.iii@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.10.2",
    "numpy>=2.5.1",
    "safetensors>=0.8.0",
]

[project.optional-dependencies]
viz = [
    "cairosvg>=2.9.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "setuptools<81",
    "simglucose",
]

[tool.uv.sources]
simglucose = { git = "https://github.com/jxx123/simglucose" }

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::SyntaxWarning",
    "ignore:pkg_resources is deprecated:UserWarning",
]
